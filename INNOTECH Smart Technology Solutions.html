<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INNOTECH Smart Technology Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#e6f1fc;--tx:#0d0d4d;--mu:#4a4f6a;--pr:#14147a;--ac:#2fa8ee;--cd:#fff;--bd:#dbe4f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1f;--bg2:#12163a;--tx:#e8ecff;--mu:#a3abc9;--pr:#5b6cff;--cd:#161a3d;--bd:#262c5c}}
:root[data-theme="dark"]{--bg:#0b0d1f;--bg2:#12163a;--tx:#e8ecff;--mu:#a3abc9;--pr:#5b6cff;--cd:#161a3d;--bd:#262c5c}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:1px;line-height:1.05;color:#0b4a9e;text-decoration:none;margin-right:auto}.logo img{height:46px;width:auto;border-radius:8px}.logo small{display:block;font-size:10px;font-weight:600;letter-spacing:.3px;margin-top:2px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:var(--tx)}:root:not([data-theme="light"]) .logo img{background:#fff;padding:3px}}:root[data-theme="dark"] .logo{color:var(--tx)}:root[data-theme="dark"] .logo img{background:#fff;padding:3px}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a,nav button,.btn{font:600 14px Montserrat,sans-serif;color:var(--tx);text-decoration:none;padding:8px 12px;border-radius:8px;border:0;background:none;cursor:pointer}
nav a.on{box-shadow:inset 0 -3px var(--ac)}
nav .shop{background:var(--ac);color:#04123a}
nav .quote,.btn{background:var(--pr);color:#fff}
.btn.alt{background:none;color:var(--pr);border:2px solid var(--pr)}
.btn.sm{padding:6px 10px;font-size:13px}
.badge{background:#e5484d;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{background:linear-gradient(120deg,#05084f,#14147a 60%,#1b4fb0);color:#fff;padding:34px 18px}
.hero h1{margin:0 0 6px;font-weight:600;font-size:clamp(26px,5vw,40px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center}
.ico{width:64px;height:64px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 8px}
.card h3{margin:4px 0;font-size:17px}.card p{margin:0 0 8px;font-size:13px;color:var(--mu)}
.tag{display:inline-block;background:var(--ac);color:#04123a;border-radius:6px;font-size:11px;font-weight:600;padding:2px 8px}
h2{font-size:30px;text-align:center;margin:30px 0 4px}.sub{text-align:center;color:var(--mu);margin:0 0 20px}
.why{background:var(--bg2);padding:26px 0;margin-top:30px}
.cta{background:var(--pr);color:#fff;border-radius:12px;text-align:center;padding:20px;margin:22px auto 0;max-width:640px}
.cta .btn{background:#fff;color:#14147a;margin:4px}
footer{background:#070a2b;color:#d8defa;font-size:13px;padding:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:6px 14px;font:600 13px Montserrat,sans-serif;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select,textarea{font:14px Montserrat,sans-serif;padding:9px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin:4px 0 10px}
.bar input{max-width:260px;margin:0 0 0 auto}
.pt{font-size:50px;background:var(--bg2);border-radius:10px;padding:16px 0;margin-bottom:8px}
.price{font-weight:800;color:var(--pr)}.st{color:#e9a400;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);text-align:left}
#modal{position:fixed;inset:0;background:rgba(5,8,40,.6);display:none;place-items:center;z-index:50;padding:14px}
#modal.open{display:grid}
#box{background:var(--bg);color:var(--tx);border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;position:relative}
#box h3{margin:0 0 10px}.x{position:absolute;right:12px;top:10px;font-size:22px;background:none;border:0;color:var(--tx);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14147a;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:60;font-size:14px}
.ord{border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--cd)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg2)}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tbl select{margin:0;padding:4px}.btn.del{background:#e5484d}</style></head><body>

const dash=tab==='dashboard'?dashboard():'';
let pbar='';
if(tab==='purchases'){const O2=db.orders.filter(o=>!pf||o.user_id===pf).sort((a,b)=>b.created-a.created),sp=O2.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+o.total,0);
t=th(['Order','Customer','Date','Products bought','Total','Payment','Status'])+O2.map(o=>{const py=db.payments.find(p=>p.order_id===o.id)||{method:'cod',status:'none'};return `<tr><td>#${o.id}</td><td>${esc(uname(o.user_id))}</td><td>${new Date(o.created).toLocaleDateString()}</td><td>${db.order_items.filter(i=>i.order_id===o.id).map(i=>esc((prod(i.product_id)||{name:'?'}).name)+' × '+i.quantity).join('<br>')||'-'}</td><td>${fmt(o.total)}</td><td>${PM[py.method]}: ${py.status}</td><td><span class="pill">${o.status}</span></td></tr>`}).join('');
pbar=`<div class="bar" style="align-items:center"><select style="max-width:300px;margin:0" onchange="pf=+this.value;route()" aria-label="Customer"><option value="0">All customers</option>${db.users.map(x=>`<option value="${x.id}" ${pf===x.id?'selected':''}>${esc(x.name)} (${esc(x.email)})</option>`).join('')}</select><span><b>${O2.length}</b> orders · <b>${fmt(sp)}</b> spent</span></div>`}
if(tab==='users')t=th(['ID','Name','Email','Role'])+opt(db.users,x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><select onchange="setRole(${x.id},this.value)" aria-label="Role"><option ${x.role==='customer'?'selected':''}>customer</option><option ${x.role==='admin'?'selected':''}>admin</option></select></td></tr>`);
return `<div class="wrap"><h2>Admin dashboard</h2><div class="bar" style="justify-content:center">${tabs.map(x=>`<button class="chip ${tab===x?'on':''}" onclick="tab='${x}';route()">${x.replace('_',' ')}</button>`).join('')}</div>${pbar}${add?`<p style="text-align:right"><button class="btn" onclick="${add[1]}()">+ ${add[0]}</button></p>`:''}${tab==='dashboard'?dash:`<div style="overflow-x:auto"><table class="tbl">${t}</table></div>`}${tab==='dashboard'||(db[tab]||db.orders).length?'':'<div class="empty">Nothing here yet. Use the button above to add the first entry.</div>'}</div>`}
const done=m=>{save();closeModal();route();toast(m)};
function formCat(){openModal(`<h3>Add category</h3><label>Name<input id="f1"></label><button class="btn" onclick="saveCat()">Save category</button>`)}
function saveCat(){const n=$('#f1').value.trim();if(!n)return toast('Enter a category name');if(db.categories.some(c=>c.name.toLowerCase()===n.toLowerCase()))return toast('Category already exists');db.categories.push({id:nid(),name:n});done('Category added')}
function delCat(id){if(db.products.some(p=>p.category_id===id))return toast('Remove or move its products first');db.categories=db.categories.filter(c=>c.id!==id);done('Category deleted')}
function formProd(){if(!db.categories.length)return toast('Add a category first');openModal(`<h3>Add product</h3><label>Category<select id="f1">${opt(db.categories,c=>`<option value="${c.id}">${esc(c.name)}</option>`)}</select></label><label>Name<input id="f2"></label><label>Price (RWF)<input id="f3" type="number" min="0"></label><label>Stock<input id="f4" type="number" min="0" value="10"></label><label>Icon (emoji)<input id="f5" value="📦" maxlength="4"></label><label>Description<textarea id="f6" rows="2"></textarea></label><button class="btn" onclick="saveProd()">Save product</button>`)}
function saveProd(){const n=$('#f2').value.trim(),pr=+$('#f3').value,st=+$('#f4').value;if(!n||!(pr>0)||st<0)return toast('Enter a name, a price above 0 and stock');db.products.push({id:nid(),category_id:+$('#f1').value,name:n,price:Math.round(pr),stock:Math.round(st),icon:$('#f5').value||'📦',description:$('#f6').value.trim()||'Genuine product with warranty.'});done('Product added')}
function delProd(id){if(db.order_items.some(i=>i.product_id===id))return toast('This product is in an order and cannot be deleted');db.products=db.products.filter(p=>p.id!==id);db.cart=db.cart.filter(c=>c.product_id!==id);done('Product deleted')}
function formOrd(){openModal(`<h3>Add order</h3><label>Customer<select id="f1">${opt(db.users,u=>`<option value="${u.id}">${esc(u.name)} (${esc(u.email)})</option>`)}</select></label><label>Delivery address<input id="f2"></label><label>Phone<input id="f3"></label><label>Status<select id="f4"><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option></select></label><p style="font-size:13px;color:var(--mu)">The total fills in as you add order items.</p><button class="btn" onclick="saveOrd()">Save order</button>`)}
function saveOrd(){const a=$('#f2').value.trim(),p=$('#f3').value.trim();if(!a||!p)return toast('Enter address and phone');const o={id:nid(),user_id:+$('#f1').value,total:0,status:$('#f4').value,address:a,phone:p,created:Date.now()};db.orders.push(o);db.payments.push({id:nid(),order_id:o.id,method:'cod',amount:0,status:'pending',reference:'TX'+Date.now().toString(36).toUpperCase()});tab='orders';done('Order added')}
function setStatus(id,v){db.orders.find(o=>o.id===id).status=v;save();toast('Status updated')}
function formItem(){if(!db.orders.length)return toast('Add an order first');openModal(`<h3>Add order item</h3><label>Order<select id="f1">${opt(db.orders,o=>`<option value="${o.id}">#${o.id} - ${esc(uname(o.user_id))}</option>`)}</select></label><label>Product<select id="f2">${opt(db.products,p=>`<option value="${p.id}">${esc(p.name)} (${fmt(p.price)}, ${p.stock} left)</option>`)}</select></label><label>Quantity<input id="f3" type="number" min="1" value="1"></label><button class="btn" onclick="saveItem()">Save order item</button>`)}
function saveItem(){const o=db.orders.find(x=>x.id===+$('#f1').value),p=prod(+$('#f2').value),n=Math.round(+$('#f3').value);if(!o||!p||!(n>0))return toast('Choose an order, a product and a quantity');if(n>p.stock)return toast('Only '+p.stock+' in stock');
db.order_items.push({id:nid(),order_id:o.id,product_id:p.id,quantity:n,unit_price:p.price});p.stock-=n;o.total+=p.price*n;const py=db.payments.find(x=>x.order_id===o.id);if(py)py.amount=o.total;tab='order_items';done('Order item added')}
function route(){const h=(location.hash||'#home').slice(1),v={shop,orders,admin,account}[h]||home;$('#app').innerHTML=v();
['home','services','shop'].forEach(n=>$('#n-'+n).classList.toggle('on',n===h||(n==='home'&&!['services','shop'].includes(h)&&h!=='orders'&&h!=='admin'&&h!=='account')));
if(h==='services')$('#svc').scrollIntoView();else if(h!=='shop'||!route.k)window.scrollTo(0,0);route.k=0}
addEventListener('hashchange',route);badge();route();
</script></body></html>
